  """
  AVATAR_DARK_MODE

  """
  Space Banner in its Full Width - Thin display style — a Space-only strip below
  the main header that holds a constant height and stretches to the width of the
  screen. Mutually exclusive with BACKGROUND_IMAGE_BANNER_FIXED_RATIO: setting
  this one clears that one. Shown to Hosts only on the Advanced Branding billing
  feature. Minimum 2880 x 150px.
  """
  BACKGROUND_IMAGE_BANNER

  """
  Space Banner in its Fixed Aspect Ratio - Tall display style — a Space-only
  banner below the main header that keeps its aspect ratio at every screen size.
  Mutually exclusive with BACKGROUND_IMAGE_BANNER: setting this one clears that
