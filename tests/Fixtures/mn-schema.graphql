  """
  Look up a member of this Network by email address, matched case-insensitively.
  Restricted to Network Hosts on a plan that includes member-emails visibility;
  an OAuth application reaches it with `host:read:network_members` or
  `host:read:network`. A member other than the caller resolves only when the
  caller would be shown that member's address on the member node, which takes
  that member's email-sharing consent unless the Network uses SSO; the caller's
  own address always resolves. Every other role, plan and consent state that
  reaches this field is answered with null — the same answer an address
  belonging to no member gets, so a refused caller cannot tell the refusal from
  an address that belongs to nobody. Failed lookups are rate limited per
  Network: past the limit the field raises `THROTTLED` until the window resets,
  and a lookup that resolves a member never counts against the budget.

  **Required scopes:** `host:read:network`, `host:read:network_members`, `host:write:network_members` (any one)
  """
