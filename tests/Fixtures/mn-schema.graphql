  """
  BACKGROUND_IMAGE_BANNER_FIXED_RATIO_MOBILE

  """
  One slot with a different name at each level: on a Network it is Global Header
  Brand, Dark Mode (the counterpart of BRAND_BANNER_ON_COLOR); on a Space it is
