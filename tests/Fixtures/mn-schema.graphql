  """
  The Network's member roster with name search (term), filters (role, member
  type, space, plan, segments, custom field answers), and sorting. Restricted to
  Network Hosts and Moderators — other viewers receive an empty connection.

  **Required scopes:** `read:network`, `host:read:network`,
  `host:read:network_members`, `host:write:network_members` (any one)
  """
  members(
    """
    Opaque cursor from pageInfo.endCursor for the next page. A cursor is only
    valid for the sort and sortOrder that produced it — and, for sort: ROLE,
    also the term — send the same values on every call of a paging run, or start
    again from the first page. Pages are ordered by the chosen sort key and then
    by the member's resource ID, and each page is a fresh read rather than a
    snapshot: a member whose sort key does not change while you page is returned
    exactly once, and one whose key changes can be returned twice or missed — so
    sort by RESOURCE_ID for a complete export. Always page from
    pageInfo.endCursor, not from an edge's own cursor, and page until
    pageInfo.hasNextPage is false.
    """
    after: String

    """
    Filter to Ambassadors — members whose referral count has reached the lowest
    Ambassador level. Results are ordered by referral count, highest first, and
    sort is fixed to referral count. Cannot be combined with term, role,
    memberType, spaceId, planId, segmentIds, or customFields. Members with equal
    counts are ordered by their Network membership, newest first. Referral
    counts change, so a member can be returned twice or missed while you page;
    this roster offers no sort whose key is fixed. Its cursors belong to this
    roster alone — a cursor from the Ambassador roster is not accepted without
    ambassador: true, and one from the full roster is not accepted with it.
    """
    ambassador: Boolean

    """
    Filter by Custom Field answers: whether the field was answered, which
    options were selected, or the answered value itself. Members must match
    every entry, and each Custom Field may be named only once.
    """
    customFields: [CustomFieldFilter!]

    """
    Number of items per page. Default: 25, maximum: 50.
    """
    first: Int = 25

    """
    Filter by member type, using the consolidated Member Type vocabulary
    (Network/space host or moderator, full member, or limited member).
    """
    memberType: MemberType

    """
    Payment Plan ID — resource ID or GlobalID. Filters to members who hold
    access to that plan: an unarchived purchase, or a subscription that is
    active, trialing, or past due — so a Host-granted comp counts the same as a paid one.
    """
    planId: ID

    """
    Filter by role in the Space this roster is scoped to (the Network here).
    """
    role: MembershipRole

    """
    GlobalIDs of Segments — Tags, Badges, and Custom Field choices are all
    Segment-backed. Members must match at least one Segment per Custom Field
    group (OR within a field, AND across fields).
    """
    segmentIds: [ID!]

    """
    Sort key. Default: LAST_VISIT.
    """
    sort: MemberSort = LAST_VISIT

    """
    Sort direction. Default: ASC.
    """
    sortOrder: SortOrder = ASC

    """
    GlobalID of a flex space within the Network; filters to members who belong to that Space.
    """
    spaceId: ID

    """
    Search by member name.
    """
    term: String
  ): MemberConnection!

